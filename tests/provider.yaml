apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: uptimekuma
spec:
  package: REGISTRY/provider-uptimekuma:test
  revisionHistoryLimit: 2
  runtimeConfigRef:
    name: uptimekuma
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: uptimekuma
spec:
  serviceAccountTemplate:
    metadata:
      name: uptimekuma-provider
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: uptimekuma-provider
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: package-runtime
              args: ["--poll-interval=2s"]
              env:
                - name: WATCH_NAMESPACE
                  value: monitoring
              readinessProbe:
                httpGet:
                  path: /readyz
                  port: 8081
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: 8081
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                capabilities:
                  drop: [ALL]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uptimekuma-credentials
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [kuma-credentials]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uptimekuma-credentials
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uptimekuma-credentials
subjects:
  - kind: ServiceAccount
    name: uptimekuma-provider
    namespace: crossplane-system
