apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: uptimekuma
spec:
  package: REGISTRY/provider-uptimekuma:test
  revisionHistoryLimit: 2
  runtimeConfigRef:
    name: uptimekuma
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: uptimekuma
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: uptimekuma-provider
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: package-runtime
              args:
                - --poll-interval=2s
              env:
                - name: WATCH_NAMESPACE
                  value: monitoring
              readinessProbe:
                httpGet:
                  path: /readyz
                  port: 8081
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: 8081
              resources:
                requests:
                  cpu: 25m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                capabilities:
                  drop:
                    - ALL
      replicas: 0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: uptimekuma-controller
  namespace: crossplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uptimekuma-controller
  namespace: monitoring
rules:
  - apiGroups:
      - uptimekuma.ops.finnes.dev
    resources:
      - providerconfigs
      - gamemonitors
      - httpmonitors
      - statuspages
      - gamemonitors/status
      - httpmonitors/status
      - statuspages/status
      - gamemonitors/finalizers
      - httpmonitors/finalizers
      - statuspages/finalizers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - ''
    resources:
      - events
    verbs:
      - create
      - update
      - patch
  - apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      - kuma-credentials
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uptimekuma-controller
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uptimekuma-controller
subjects:
  - kind: ServiceAccount
    name: uptimekuma-controller
    namespace: crossplane-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptimekuma-controller
  namespace: crossplane-system
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: uptimekuma-provider
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: package-runtime
          args:
            - --poll-interval=2s
          env:
            - name: WATCH_NAMESPACE
              value: monitoring
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          image: REGISTRY/provider-uptimekuma:test
      serviceAccountName: uptimekuma-controller
