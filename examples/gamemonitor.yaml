apiVersion: uptimekuma.finnes.dev/v1alpha1
kind: GameMonitor
metadata:
  name: game-server
  namespace: monitoring
spec:
  managementPolicies: [Observe, Create, Update, LateInitialize]
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    name: Game server
    hostname: mc.example.org
    port: 25565
    game: minecraft
    gamedigGivenPortOnly: true
    interval: 60
    active: true
