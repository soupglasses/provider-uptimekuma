apiVersion: v1
kind: Secret
metadata:
  name: kuma-credentials
  namespace: monitoring
stringData:
  password: replace-with-the-kuma-password
---
apiVersion: uptimekuma.finnes.dev/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: monitoring
spec:
  endpoint: https://status.example.org
  username: admin
  passwordSecretRef:
    name: kuma-credentials
    key: password
